[project]
name = "instasurveillance-backend"
version = "0.1.0"
description = "Instagram relationship analytics API and workers"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.142.2", "uvicorn==0.54.0", "pydantic-settings==2.15.0",
  "sqlalchemy[asyncio]==2.1.3", "psycopg[binary]==3.3.6", "alembic==1.20.0",
  "celery==5.6.3", "redis==8.1.0", "instagrapi==3.0.20",
  "argon2-cffi==25.1.0", "cryptography==50.0.2", "structlog==26.1.0",
  "python-multipart==0.0.32", "email-validator==2.3.0", "boto3==1.43.108"
]
[tool.poetry]
package-mode = false
[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"
httpx = "0.28.1"
ruff = "0.16.10"
pip-audit = "2.10.1"
pyright = "1.1.414"
[tool.ruff]
line-length = 110
cache-dir = "/tmp/instasurveillance-ruff"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pyright]
include = ["app"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
